<!-- @dsCard group="Member Area" viewport="1280x820" name="Member area" subtitle="Signed-in home, library, profile" -->
<!doctype html><html><head><meta charset="utf-8"><title>RIM — Member Area Kit</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--rim-bg)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel" src="Dashboard.jsx"></script>
<script type="text/babel" src="Profile.jsx"></script>
<script type="text/babel">
const { MemberBar, AccountSidebar, SiteFooter, Card, Button, TextField } = window.RootedInMindfulnessDesignSystem_980dba;
const Icon = ({n}) => <i data-lucide={n} style={{display:"inline-flex"}}></i>;
const NAME = "Marguerite Chen";
const LINKS = [
  { label:"Home", href:"/account/dashboard", icon:<Icon n="home"/> },
  { label:"Library", href:"/account/courses", icon:<Icon n="book-open"/> },
  { label:"My Profile", href:"/account/dashboard-my-profile", icon:<Icon n="user-circle"/> },
];
const TEAMS = [{ label:"Saturday Host Team", href:"/account/hub/saturday", icon:<Icon n="users-round"/> },{ label:"Welcome Team", href:"/account/hub/welcome", icon:<Icon n="users-round"/> }];

function SignIn({ onSignIn }) {
  return (
    <div style={{ minHeight:"100vh", display:"grid", placeItems:"center", background:"var(--rim-bg)", padding:"40px 20px" }}>
      <Card padding={40} style={{ width:"min(100%,460px)" }}>
        <img src="../../assets/logo/Rooted-In-Mindfulness-Logo.png" height="52" style={{display:"block",margin:"0 auto 20px"}} />
        <h1 style={{ margin:"0 0 8px", fontSize:"var(--text-h2)", textAlign:"center" }}>Welcome back</h1>
        <p style={{ margin:"0 0 26px", textAlign:"center", color:"var(--rim-text-muted)", fontSize:"var(--text-small)" }}>Enter your email and we'll send you a sign-in link. No password to remember.</p>
        <TextField label="Email address" type="email" placeholder="you@example.org" defaultValue="marguerite@example.org" />
        <div style={{ marginTop:20 }}><Button fullWidth size="lg" onClick={onSignIn}>Email me a link</Button></div>
        <p style={{ margin:"20px 0 0", textAlign:"center", fontSize:"var(--text-xs)", color:"var(--rim-text-muted)" }}>Not a member yet? <a href="#">Read our community care agreements and join</a>.</p>
      </Card>
    </div>
  );
}

function Zoom({ onBack }) {
  return (
    <div style={{ minHeight:"70vh", display:"grid", placeItems:"center", padding:"32px 20px", background:"var(--rim-bg)" }}>
      <div style={{ width:"min(100%,520px)", padding:40, border:"1px solid var(--rim-rule)", borderRadius:14, background:"var(--rim-surface)", textAlign:"center" }}>
        <p style={{ margin:"0 0 12px", color:"var(--rim-text-muted)", fontSize:"var(--text-xxs)", fontWeight:700, letterSpacing:"0.1em", textTransform:"uppercase" }}>Opening Zoom</p>
        <h1 style={{ margin:"0 0 12px", fontSize:"var(--text-h2)" }}>The Art of Meditation</h1>
        <p style={{ margin:"0 0 24px", color:"var(--rim-text-muted)", fontSize:"var(--text-small)" }}>If nothing happens in a few seconds, use the link below. Someone is always in the room a little early.</p>
        <a href="#" onClick={(e)=>{e.preventDefault();onBack();}} style={{ display:"inline-flex", alignItems:"center", justifyContent:"center", minHeight:44, padding:"10px 18px", border:"1px solid var(--rim-blue)", borderRadius:999, color:"var(--rim-blue)", fontSize:"var(--text-ui)", fontWeight:600, textDecoration:"none" }}>Open the session</a>
      </div>
    </div>
  );
}

function Library() {
  return (
    <div style={{maxWidth:820}}>
      <h1 style={{margin:"0 0 10px",fontSize:"var(--text-h1)"}}>Library</h1>
      <p style={{color:"var(--rim-text-muted)",fontSize:"var(--text-small)"}}>Your enrolled courses and learning materials.</p>
    </div>
  );
}

function App(){
  const [signedIn,setSignedIn]=React.useState(true);
  const [route,setRoute]=React.useState("/account/dashboard");
  React.useEffect(()=>{ if(window.lucide) lucide.createIcons({attrs:{width:17,height:17,'stroke-width':1.75}}); });
  if(!signedIn) return <SignIn onSignIn={()=>setSignedIn(true)} />;
  return (<>
    <MemberBar logoSrc="../../assets/logo/Rooted-In-Mindfulness-Logo.png" name={NAME} onSignOut={()=>setSignedIn(false)} />
    <div style={{ display:"flex", minHeight:"calc(100vh - 68px)", background:"var(--rim-bg)" }} onClick={(e)=>{
      const a=e.target.closest && e.target.closest("a[href^='/account']");
      if(a){ e.preventDefault(); setRoute(a.getAttribute("href")); window.scrollTo(0,0); }
    }}>
      <AccountSidebar activeHref={route} sections={[{ label:"My RIM", links:LINKS },{ label:"Your teams", links:TEAMS }]} />
      <div style={{ flex:1, padding:"56px 64px 96px" }}>
        {route==="/account/dashboard" && <Dashboard name={NAME} onJoin={()=>setRoute("/account/zoom")} />}
        {route==="/account/courses" && <Library />}
        {route==="/account/dashboard-my-profile" && <Profile />}
        {route==="/account/zoom" && <Zoom onBack={()=>setRoute("/account/dashboard")} />}
        {route.startsWith("/account/hub/") && (
          <div style={{maxWidth:820}}>
            <h1 style={{margin:"0 0 10px",fontSize:"var(--text-h1)"}}>Saturday Host Team</h1>
            <p style={{color:"var(--rim-text-muted)",fontSize:"var(--text-small)"}}>Team workspaces (schedule, conversations, files) exist in the product but are not recreated in this kit.</p>
          </div>
        )}
      </div>
    </div>
    <SiteFooter logoSrc="../../assets/logo/RIM-Website-Footer-Logo-White.png" memberArea />
  </>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
