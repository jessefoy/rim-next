<!-- @dsCard group="Brand" viewport="700x180" name="Interaction states" subtitle="Hover, focus, disabled — no motion beyond a 0.15s fade" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--rim-bg);font-family:var(--font-sans);color:var(--rim-text)}.p{padding:20px}.b{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 22px;border-radius:9999px;font-size:14px;font-weight:600;font-family:var(--font-sans)}</style></head><body><div class="p" style="display:grid;gap:14px">
<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<span class="b" style="background:var(--rim-blue);color:#fff">Default</span>
<span class="b" style="background:var(--rim-mid);color:#fff">Hover · --rim-mid</span>
<span class="b" style="background:var(--rim-blue);color:#fff;outline:2px solid var(--rim-mid);outline-offset:2px">Focus ring</span>
<span class="b" style="background:var(--rim-mid);color:#fff;opacity:.45">Disabled · .45</span>
</div>
<div style="font-size:13px;color:var(--rim-text-muted);line-height:1.7">Links underline on hover. Cards shift fill to <code style="font-family:var(--font-mono)">--rim-bg-bright</code>, never their shadow. Transitions are 0.15s on colour only — no transform, no scale, no bounce. Nothing in RIM moves on press.</div>
</div></body></html>
