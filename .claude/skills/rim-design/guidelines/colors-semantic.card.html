<!-- @dsCard group="Colors" viewport="700x180" name="Semantic feedback" subtitle="Success, warning, error, alert — background + accent pairs" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--rim-bg);font-family:var(--font-sans);color:var(--rim-text)}.p{padding:20px}</style></head><body><div class="p" style="display:grid;gap:8px">
<p style="margin:0;padding:14px 16px;border-left:3px solid var(--color-success);border-radius:4px;background:var(--color-success-bg);font-size:15px"><strong>Success.</strong> Your changes have been saved. <span style="color:var(--rim-text-muted);font-size:11px">#2e7d32 on #e8f5e9</span></p>
<p style="margin:0;padding:14px 16px;border-left:3px solid var(--color-warning);border-radius:4px;background:var(--color-warning-bg);font-size:15px"><strong>Please note.</strong> This action needs your attention. <span style="color:var(--rim-text-muted);font-size:11px">#7a4f00 on #fff8ec</span></p>
<p style="margin:0;padding:14px 16px;border-left:3px solid var(--color-error);border-radius:4px;background:var(--color-error-bg);font-size:15px"><strong>Something needs fixing.</strong> Check the highlighted field. <span style="color:var(--rim-text-muted);font-size:11px">#c0392b on #fef2f2</span></p>
<p style="margin:0;padding:14px 16px;border-left:3px solid var(--color-alert);border-radius:4px;background:var(--color-alert-bg);font-size:15px"><strong>Alert.</strong> Session starts in ten minutes. <span style="color:var(--rim-text-muted);font-size:11px">#C8821A on #FDF6EC</span></p>
</div></body></html>
