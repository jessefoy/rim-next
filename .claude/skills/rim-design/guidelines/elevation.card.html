<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="One shadow, deliberately a whisper" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--rim-bg);font-family:var(--font-sans);color:var(--rim-text)}.p{padding:20px}</style></head><body><div class="p" style="display:flex;gap:16px;align-items:stretch">
<div style="flex:1;background:var(--rim-surface);border-radius:10px;padding:20px;box-shadow:var(--card-shadow)"><div style="font-size:13px;font-weight:700;margin-bottom:6px">--card-shadow</div><div style="font-size:11px;color:var(--rim-text-muted);font-family:var(--font-mono)">0 1px 2px rgba(45,38,28,.03),<br>0 4px 11px rgba(45,38,28,.035)</div></div>
<div style="flex:1;background:var(--rim-surface);border-radius:10px;padding:20px;border:1px solid var(--rim-rule)"><div style="font-size:13px;font-weight:700;margin-bottom:6px">1px rule, no shadow</div><div style="font-size:11px;color:var(--rim-text-muted)">Form cards and today-cards in the member area use a border instead of lift.</div></div>
<div style="flex:1;background:var(--rim-bg-accent);border-radius:10px;padding:20px"><div style="font-size:13px;font-weight:700;margin-bottom:6px">Panel — no elevation</div><div style="font-size:11px;color:var(--rim-text-muted)">A panel recedes; it never lifts.</div></div>
</div></body></html>
