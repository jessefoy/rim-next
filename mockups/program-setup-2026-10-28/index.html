    if (t.dataset.publish) { published = true; flash = "Published. It's on Programs & Events, and the Hosting Team has been told."; show("program"); return; }
    if (t.dataset.draft) { flash = "Kept as a draft. It's in Programs under Drafts, just as you left it."; review(); return; }
    if (t.dataset.saveEdit) { flash = t.dataset.saveEdit === "quiet" ? "Saved. Maria has been told about her sessions." : "Saved. The update is on its way, and Maria has been told about her sessions."; mode = "new"; show("program"); return; }
    if (t.dataset.cancelEdit) { s = original; mode = "new"; flash = ""; show("program"); return; }
    if (t.dataset.pick) { s[t.dataset.pick] = t.dataset.day; reconcile(t.dataset.pick); problem = ""; walk(); document.querySelector(`[data-day="${t.dataset.day}"]`)?.focus(); return; }
    if (t.dataset.cal) {
      const k = t.dataset.cal, v = s._cal[k] || (s[k] || "2026-10-01").slice(0, 7);
      const [y, m] = v.split("-").map(Number); const n = new Date(Date.UTC(y, m - 1 + +t.dataset.dir, 1));
      s._cal[k] = n.toISOString().slice(0, 7); walk(); document.querySelector(`[data-cal="${k}"][data-dir="${t.dataset.dir}"]`)?.focus(); return;
    }
    if (t.dataset.homefrom) { s._homeFromOpen = !s._homeFromOpen; walk(); return; }
    if (t.dataset.qdel !== undefined) { s.questions.splice(+t.dataset.qdel, 1); walk(); return; }
    if (t.dataset.qadd) { s.questions.push({ label: "How did you hear about this program?", kind: "A short answer", required: false, by: "the registration team" }); walk(); return; }
    if (t.dataset.tpl) { s.danaMsg = { "General support": "Your dana makes this program possible. RIM is supported entirely by the generosity of our community. Every amount is welcome.", Reciprocity: "This is an old practice of reciprocity: the teachings are offered freely, and we give back as we are able. All amounts are welcome.", "No one turned away": "Please offer an amount that reflects both your means and your appreciation for the teaching. No one is turned away for lack of funds." }[t.dataset.tpl]; walk(); return; }
    if (t.dataset.nav) {
      const steps = live(), st = step(), i = steps.indexOf(st);
      if (t.dataset.nav === "back") { goStep(steps[Math.max(0, i - 1)].id); return; }
      if (t.dataset.nav === "next" || t.dataset.nav === "skip") {
        const need = t.dataset.nav === "next" && st.need && st.need(s);
        if (need) { problem = need; walk(); document.querySelector("[role=alert]")?.scrollIntoView({ block: "center" }); return; }
        if (fromReview) { fromReview = false; show("review"); return; }
        if (i === steps.length - 1) { show(mode === "new" ? "review" : "confirm"); return; }
        goStep(steps[i + 1].id);
      }
    }
  });

  function rerenderKeepingFocus() {
    const a = document.activeElement, id = a && a.id, pos = a && a.selectionStart;
    walk();
    if (id) { const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (_) {} } }
  }
  document.addEventListener("input", (e) => {
    const el = e.target;
    if (!app.contains(el)) return;
    if (el.dataset.k) {
      s[el.dataset.k] = el.type === "checkbox" ? el.checked : el.value;
      if (el.dataset.k === "kitchen" && !el.checked) s.kitchenReach = false;
      if (el.dataset.k === "noTeacher" && el.checked) s.teachers = [];
      reconcile(el.dataset.k); problem = "";
      rerenderKeepingFocus();
    }
  });
  document.addEventListener("change", (e) => {
    const el = e.target;
    if (!app.contains(el)) return;
    if (el.type === "radio" && el.name) {
      const before = s[el.name];
      let v = el.value; if (el.name === "monthDay") v = +v; if (el.name === "monthWeek") v = v === "last" ? "last" : +v;
      s[el.name] = v;
      const msgs = reconcile(el.name);
      changeMsg = msgs.length && ((before != null && before !== v) || msgs.some((m) => m.includes("first session"))) ? msgs.join(" ") : "";
      problem = ""; walk(); document.querySelector(`input[name="${el.name}"][value="${el.value}"]`)?.focus();
      return;
    }
    if (el.dataset.day !== undefined && el.type === "checkbox") { const d = +el.dataset.day; s.days = el.checked ? [...s.days, d] : s.days.filter((x) => x !== d); const dm = reconcile("days"); changeMsg = dm.some((m) => m.includes("first session")) ? dm.filter((m) => m.includes("first session")).join(" ") : changeMsg; problem = ""; walk(); document.querySelector(`input[data-day="${d}"]`)?.focus(); return; }
    if (el.dataset.teacher) { const n = el.dataset.teacher; s.teachers = el.checked ? [...s.teachers, n] : s.teachers.filter((x) => x !== n); if (el.checked) s.noTeacher = false; walk(); return; }
    if (el.dataset.team) { const n = el.dataset.team; s.support = el.checked ? [...s.support, n] : s.support.filter((x) => x !== n); walk(); return; }
    const row = el.closest("[data-time]");
    if (row) {
      const g = (p) => row.querySelector(`[data-part="${p}"]`).value;
      let h = +g("h") % 12; if (g("ap") === "PM") h += 12;
      s[row.dataset.time] = `${String(h).padStart(2, "0")}:${g("m")}`;
      problem = ""; const part = el.dataset.part; walk(); document.querySelector(`[data-time="${row.dataset.time}"] [data-part="${part}"]`)?.focus();
    }
  });

  show("start");
})();

</script>
</body>
